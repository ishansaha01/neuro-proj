# Demo dataset: 8 scenes on the pixel grid of the diffusion prior, 40 statistical power
# Doppler images each (20 task and 20 rest). Measured on the 2-core development machine
# (2026-11-17, seed 0): 1300 s for the 8 scenes, 0.5 GB per scene bundle, 3.8 GB in all;
# one scene is in memory at a time (about 1.3 GiB, as for configs/run_demo.yaml).
#   python scripts/make_dataset.py --config configs/sweep_demo.yaml --seed 0 --out outputs/demo_sweep
# `base` equals configs/run_demo.yaml except for `trials` (checked by
# tests/unit/data/test_configs.py). Every scene has its own skull, CT noise and speckle
# (seed subtree `child(i)`); the probe pose, the target site and the electronic noise level
# vary as listed at the end. The centre frequency and the skull-effect switches stay at the
# base values: the element pitch follows the wavelength, and below 2 MHz the 128-element
# aperture no longer fits the 80 mm head box.
base:
  head:
    grid:
      spacing: 0.5e-3
      region: box
      box_size: [0.08, 0.08, 0.08]
      box_center_depth: 0.025
  imaging:
    transducer:
      n_elements: 128
      center_frequency: 2.0e6      # Hz
    frequencies:
      n_frequencies: 136           # the 34 mm deep ROI needs at least 132 (fus.window)
    roi:
      x_range: [-0.016, 0.016]     # m
      z_range: [0.0105, 0.0445]    # m
      spacing: 1.0e-3
    pixels:
      shape: [32, 32]
      spacing: 1.0e-3
    noise:
      # 30 dB above the fus default of -10 dB; assumed, to verify. At 2 MHz the skull of this
      # head costs about 33 dB two-way, so -10 dB leaves the uncorrected blood signal about
      # 35 dB under the noise floor (nothing to reconstruct), while 20 dB puts it a few dB
      # under the floor: the regime in which transcranial Doppler is just workable.
      electronic_snr_db: 20.0
    fidelity: statistical
  backend:
    backend: ray
  ct_prior:
    slab_half_slices: 0            # only the central slice enters the plane's medium
  medium_spacing: 1.0e-4           # m
  source_refinement: 2             # 0.5 mm sub-cells; one sample per 1 mm pixel overstates the
                                   # clean blood signal 2.2 times, 2 x 2 is within 1 % of 4 x 4
  trials:
    n_images: 40
    image_interval: 3.0            # s: 0 to 117 s, three 20 s task blocks and the rests between
    amplitude_jitter: 0.2          # block-to-block response variation
n_scenes: 8
probe_shift_jitter: 3.0e-3       # m
probe_tilt_jitter_deg: 2.0
target_direction_jitter_deg: 5.0
electronic_snr_db: [10.0, 20.0, 30.0]
